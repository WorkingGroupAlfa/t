services:
  - type: web
    name: united-lifestyle-traralgon
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: cms-data
      mountPath: /var/data
      sizeGB: 1
